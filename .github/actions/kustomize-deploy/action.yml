name: kustomize-deploy
description: Fija el tag de imagen en un overlay de Kustomize y lo aplica al clúster.

inputs:
  overlay:
    description: Ruta al overlay de Kustomize (p. ej. deploy/k8s/overlays/dev)
    required: true
  image_tag:
    description: Tag de imagen a desplegar (p. ej. sha-abc123)
    required: true
  kubeconfig:
    description: Contenido del kubeconfig con un ServiceAccount de despliegue (permisos mínimos en el namespace)
    required: true
  namespace:
    description: Namespace destino
    required: true

runs:
  using: composite
  steps:
    - name: Instalar kubectl y kustomize
      shell: bash
      run: |
        curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.30.4/bin/linux/amd64/kubectl"
        chmod +x /usr/local/bin/kubectl
        curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz -C /usr/local/bin

    - name: Configurar acceso al clúster
      shell: bash
      run: |
        mkdir -p "$HOME/.kube"
        printf '%s' "${{ inputs.kubeconfig }}" > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"

    - name: Fijar tag de imagen
      shell: bash
      working-directory: ${{ inputs.overlay }}
      run: |
        OWNER="${GITHUB_REPOSITORY_OWNER}"
        kustomize edit set image \
          "ghcr.io/OWNER/agriaudit-backend=ghcr.io/${OWNER}/agriaudit-backend:${{ inputs.image_tag }}" \
          "ghcr.io/OWNER/agriaudit-frontend=ghcr.io/${OWNER}/agriaudit-frontend:${{ inputs.image_tag }}" \
          "ghcr.io/OWNER/agriaudit-ocr=ghcr.io/${OWNER}/agriaudit-ocr:${{ inputs.image_tag }}"

    - name: Aplicar
      shell: bash
      run: |
        kustomize build "${{ inputs.overlay }}" | kubectl apply -n "${{ inputs.namespace }}" -f -
        kubectl -n "${{ inputs.namespace }}" rollout status deploy/backend  --timeout=180s
        kubectl -n "${{ inputs.namespace }}" rollout status deploy/frontend --timeout=120s
        kubectl -n "${{ inputs.namespace }}" rollout status deploy/ocr      --timeout=180s
