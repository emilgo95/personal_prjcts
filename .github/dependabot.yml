# Actualizaciones automáticas de dependencias (Dependabot). Las de seguridad llegan siempre; las de versión,
# agrupadas y una vez por semana para no saturar de PR. Todo pasa por la CI (`ci-ok`) antes de fusionar.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday, timezone: Europe/Madrid }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, backend]
    groups:
      spring:
        patterns: ["org.springframework.*"]
        update-types: [minor, patch]
      dependencias-menores:
        patterns: ["*"]
        exclude-patterns: ["org.springframework.*"]
        update-types: [minor, patch]
    ignore:
      # Spring Boot sí puede proponer saltos de generación (la PR hay que acompañarla de Modulith, springdoc y
      # Testcontainers: ver la rama experimental `experimento/spring-boot-4.1`). Lo que va ligado a esa generación
      # no se propone por separado.
      - dependency-name: org.springframework.modulith:*
        update-types: [version-update:semver-major]
      - dependency-name: org.springdoc:*
        update-types: [version-update:semver-major]
      # Apache POI 6 es un salto mayor que conviene probar a mano con los informes Excel.
      - dependency-name: org.apache.poi:*
        update-types: [version-update:semver-major]

  - package-ecosystem: maven
    directory: /api-tests
    schedule: { interval: weekly, day: monday, timezone: Europe/Madrid }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, tests]
    groups:
      pruebas-api:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, timezone: Europe/Madrid }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, frontend]
    groups:
      react-mui:
        patterns: ["react*", "@mui/*", "@emotion/*", "@tanstack/*"]
        update-types: [minor, patch]
      dependencias-menores:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Base de la interfaz y herramientas de compilación: los saltos mayores se suben a mano, tras probarlos.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@mui/*"
        update-types: [version-update:semver-major]
      - dependency-name: "react*"
        update-types: [version-update:semver-major]
      - dependency-name: "@tanstack/*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly, day: monday, timezone: Europe/Madrid }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, tests]
    groups:
      e2e:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Europe/Madrid }
    commit-message: { prefix: "chore(ci)" }
    labels: [dependencies, ci]
    groups:
      acciones:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /ocr]
    schedule: { interval: weekly, day: monday, timezone: Europe/Madrid }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, docker]
    ignore:
      # Java: solo versiones LTS. Hoy 21 y 25; se descartan las intermedias (22-24) y las posteriores (26+) hasta
      # que haya otra LTS. La imagen de compilación `maven:3.9-eclipse-temurin-N` no se puede filtrar por la N, así
      # que se sube a mano junto con la migración a Java 25.
      - dependency-name: eclipse-temurin
        versions: [">= 22, < 25", ">= 26"]
      - dependency-name: maven
      # Node: los saltos de versión mayor se hacen a mano y solo a versiones LTS (pares).
      - dependency-name: node
        update-types: [version-update:semver-major]
