name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Permisos mínimos a nivel de workflow. El job `codeql` declara los suyos.
permissions:
  contents: read
  pull-requests: read    # dorny/paths-filter lee los ficheros cambiados del PR vía API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Detectar qué partes del monorepo han cambiado
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ocr: ${{ steps.filter.outputs.ocr }}
      e2e: ${{ steps.filter.outputs.e2e }}
      apitests: ${{ steps.filter.outputs.apitests }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ocr:
              - 'ocr/**'
            e2e:
              - 'e2e/**'
            apitests:
              - 'api-tests/**'
            compose:
              - 'docker-compose.yml'
              - '.env.example'

  # ---------------------------------------------------------------------------
  # 2. Backend: compilar, tests, verificación de arquitectura, análisis
  # ---------------------------------------------------------------------------
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Los tests de integración levantan Postgres con Testcontainers (usa el
    # Docker del runner); no se necesita un `services:` declarado aquí.
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y test (unit + integración con Testcontainers)
        working-directory: backend
        run: mvn -B -ntp clean verify

      # La verificación de límites de módulo (Spring Modulith / ArchUnit) forma
      # parte de `mvn verify`: el test ModularityTests#verifiesModularStructure
      # y las reglas de hexagonal (dominio sin imports de jakarta.persistence).

      - name: Informe de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend
          path: backend/target/site/jacoco/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2b. CodeQL (SAST) — job propio, análisis de fuente (build-mode: none).
  #     Informativo: sube hallazgos a la pestaña Security; NO forma parte de
  #     `ci-ok`, así que no bloquea la fusión por ahora.
  # ---------------------------------------------------------------------------
  codeql:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ---------------------------------------------------------------------------
  # 3. Frontend: typecheck, tests, build
  # ---------------------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test -- --run

  # ---------------------------------------------------------------------------
  # 3b. E2E: arranque completo con Docker Compose + smoke + Playwright (UI/a11y)
  #     + Karate (API). Una sola pila para las dos suites.
  # ---------------------------------------------------------------------------
  e2e:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ocr == 'true' ||
      needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.apitests == 'true' ||
      needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar la aplicación
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Esperar y comprobar salud (smoke)
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8081/actuator/health | grep -q UP && break || sleep 5
          done
          curl -fsS http://localhost:8081/actuator/health | grep -q UP
          curl -fsS -o /dev/null -w "frontend HTTP %{http_code}\n" http://localhost:8080

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright — instalar dependencias y navegador
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Playwright — tests E2E (UI + accesibilidad)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:8081
        run: npm test

      - name: Configurar JDK 21
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Karate — tests de API
        if: always()
        working-directory: api-tests
        env:
          API_BASE_URL: http://localhost:8081
        run: mvn -B -ntp test

      - name: Logs de la aplicación si algo falla
        if: failure()
        run: docker compose logs

      - name: Publicar informe de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar informe de Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-report
          path: api-tests/target/karate-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Parar
        if: always()
        run: docker compose down -v

  # NOTA: la construcción y publicación de imágenes a un registro (GHCR) se
  # añadirá cuando exista un destino de despliegue real (ver docs/FASE-0.md,
  # local-only). Hoy `compose-smoke` ya construye las imágenes para probarlas.
  # Cuando vuelva, fijar las acciones por SHA (RS-SUPPLY-06) y usar una versión
  # válida de aquasecurity/trivy-action.

  # ---------------------------------------------------------------------------
  # 5. Puerta única de CI — es el ÚNICO check requerido por la protección de main.
  #    Pasa si todos los jobs relevantes terminaron OK o se saltaron (skipped);
  #    falla si alguno falló o fue cancelado.
  # ---------------------------------------------------------------------------
  ci-ok:
    if: always()
    needs: [changes, backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultados
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "Resultados de los jobs: $results"
          case "$results" in
            *failure*|*cancelled*) echo "::error::Algún job de CI ha fallado"; exit 1 ;;
            *) echo "CI en verde"; exit 0 ;;
          esac
