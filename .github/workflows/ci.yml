name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write        # publicar imagen en GHCR
  id-token: write        # OIDC (si se adopta federación de identidad)
  security-events: write # subir resultados de CodeQL / Trivy

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # OWNER se resuelve a la organización/usuario dueño del repo
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Detectar qué partes del monorepo han cambiado
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ocr: ${{ steps.filter.outputs.ocr }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ocr:
              - 'ocr/**'
            deploy:
              - 'deploy/**'
              - '.github/workflows/**'

  # ---------------------------------------------------------------------------
  # 2. Backend: compilar, tests, verificación de arquitectura, análisis
  # ---------------------------------------------------------------------------
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Los tests de integración levantan Postgres con Testcontainers (usa el
    # Docker del runner); no se necesita un `services:` declarado aquí.
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y test (unit + integración con Testcontainers)
        working-directory: backend
        run: mvn -B -ntp clean verify

      # La verificación de límites de módulo (Spring Modulith / ArchUnit) forma
      # parte de `mvn verify`: el test ModularityTests#verifiesModularStructure
      # y las reglas de hexagonal (dominio sin imports de jakarta.persistence).

      - name: Informe de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend
          path: backend/target/site/jacoco/
          if-no-files-found: warn

      - name: CodeQL (Java)
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # 3. Frontend: typecheck, tests, build
  # ---------------------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test -- --run

  # ---------------------------------------------------------------------------
  # 3b. Arranque completo con Docker Compose + smoke test (la "prueba de dev")
  # ---------------------------------------------------------------------------
  compose-smoke:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ocr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar la aplicación
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Esperar y comprobar salud
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8081/actuator/health | grep -q UP && break || sleep 5
          done
          curl -fsS http://localhost:8081/actuator/health | grep -q UP
          curl -fsS -o /dev/null -w "frontend HTTP %{http_code}\n" http://localhost:8080
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs
      - name: Parar
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 4. Validar los manifiestos de Kubernetes (siempre que cambien)
  # ---------------------------------------------------------------------------
  manifests:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kustomize y kubeconform
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin kubeconform
      - name: Renderizar y validar cada overlay
        run: |
          for ov in deploy/k8s/overlays/*; do
            echo "== $ov =="
            kustomize build "$ov" | kubeconform -strict -summary -ignore-missing-schemas
          done

  # ---------------------------------------------------------------------------
  # 5. Construir y publicar imágenes (solo en push a main)
  # ---------------------------------------------------------------------------
  images:
    needs: [changes, backend, frontend]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: agriaudit-backend,  context: backend,  changed: backend }
          - { name: agriaudit-frontend, context: frontend, changed: frontend }
          - { name: agriaudit-ocr,      context: ocr,      changed: ocr }
    steps:
      - uses: actions/checkout@v4

      - name: ¿Este componente ha cambiado?
        id: gate
        run: echo "build=${{ needs.changes.outputs[matrix.changed] }}" >> "$GITHUB_OUTPUT"

      - name: Login en GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de la imagen
        if: steps.gate.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push (Buildx)
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Escaneo de vulnerabilidades de la imagen
        if: steps.gate.outputs.build == 'true'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
      - name: Subir resultados de Trivy
        if: steps.gate.outputs.build == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif

  # ---------------------------------------------------------------------------
  # 6. Puerta única de CI — es el ÚNICO check requerido por la protección de main.
  #    Pasa si todos los jobs relevantes terminaron OK o se saltaron (skipped);
  #    falla si alguno falló o fue cancelado.
  # ---------------------------------------------------------------------------
  ci-ok:
    if: always()
    needs: [changes, backend, frontend, compose-smoke, manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultados
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "Resultados de los jobs: $results"
          case "$results" in
            *failure*|*cancelled*) echo "::error::Algún job de CI ha fallado"; exit 1 ;;
            *) echo "CI en verde"; exit 0 ;;
          esac
