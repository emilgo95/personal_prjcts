apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr
  labels: { app.kubernetes.io/name: ocr }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ocr }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ocr }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ocr
          image: ghcr.io/OWNER/agriaudit-ocr
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 1Gi }   # los modelos ONNX ocupan memoria
            limits:   { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: ocr
spec:
  selector: { app.kubernetes.io/name: ocr }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
# El OCR no debe ser accesible desde fuera: solo el backend lo llama.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocr-allow-backend-only
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ocr }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: backend }
      ports:
        - { protocol: TCP, port: 8000 }
