apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        # Requiere que la imagen use nginx "unprivileged" y nginx.conf con `listen 8080`.
        # Ver deploy/k8s/README.md (cambios en frontend/Dockerfile y frontend/nginx.conf).
        - name: frontend
          image: ghcr.io/OWNER/agriaudit-frontend
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agriaudit
  annotations:
    # Ajustar a la ingress class del clúster (nginx, traefik, etc.)
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: letsencrypt   # si el clúster tiene cert-manager
spec:
  ingressClassName: nginx
  tls:
    - hosts: [HOST_PLACEHOLDER]
      secretName: agriaudit-tls
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8081 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
