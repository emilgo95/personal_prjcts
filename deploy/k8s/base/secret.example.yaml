# PLANTILLA — NO contiene secretos reales y NO se aplica directamente.
#
# Los secretos NO se guardan en Git en claro. Elegir una de estas dos vías:
#
#  A) Sealed Secrets (bitnami)  -> `kubeseal` cifra este manifiesto con la clave
#     pública del clúster; el resultado (SealedSecret) SÍ se puede commitear.
#         kubectl create secret generic backend-secrets \
#           --from-literal=SPRING_DATASOURCE_URL='jdbc:postgresql://postgres.db.svc:5432/agriaudit' \
#           --from-literal=SPRING_DATASOURCE_USERNAME='agriaudit' \
#           --from-literal=SPRING_DATASOURCE_PASSWORD='...' \
#           --from-literal=JWT_SECRET='...' \
#           --from-literal=AGRIAUDIT_STORAGE_S3_ENDPOINT='https://minio.storage.svc' \
#           --from-literal=AGRIAUDIT_STORAGE_S3_ACCESS_KEY='...' \
#           --from-literal=AGRIAUDIT_STORAGE_S3_SECRET_KEY='...' \
#           --dry-run=client -o yaml | kubeseal --format yaml > overlays/<env>/backend-sealedsecret.yaml
#
#  B) External Secrets Operator -> el secreto vive en Vault / AWS SM / GCP SM y
#     un `ExternalSecret` lo materializa en el clúster. Recomendado si ya tenéis
#     un gestor de secretos corporativo.
#
# Claves que el backend espera en el Secret `backend-secrets`:
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://CHANGE-ME:5432/agriaudit"
  SPRING_DATASOURCE_USERNAME: "CHANGE-ME"
  SPRING_DATASOURCE_PASSWORD: "CHANGE-ME"
  JWT_SECRET: "CHANGE-ME-long-random"
  AGRIAUDIT_STORAGE_S3_ENDPOINT: "CHANGE-ME"
  AGRIAUDIT_STORAGE_S3_BUCKET: "agriaudit-evidence"
  AGRIAUDIT_STORAGE_S3_ACCESS_KEY: "CHANGE-ME"
  AGRIAUDIT_STORAGE_S3_SECRET_KEY: "CHANGE-ME"
