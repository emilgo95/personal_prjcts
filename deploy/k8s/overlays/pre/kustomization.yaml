apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agriaudit-pre

resources:
  - ../../base

configMapGenerator:
  - name: backend-config
    behavior: merge
    envs:
      - config.env

patches:
  - target: { kind: Ingress, name: agriaudit }
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: agriaudit.pre.example.internal
      - op: replace
        path: /spec/rules/0/host
        value: agriaudit.pre.example.internal
