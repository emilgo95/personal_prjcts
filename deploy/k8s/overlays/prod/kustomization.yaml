apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agriaudit-prod

resources:
  - ../../base

configMapGenerator:
  - name: backend-config
    behavior: merge
    envs:
      - config.env

patches:
  - target: { kind: Ingress, name: agriaudit }
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: docs.agriaudit.example.com
      - op: replace
        path: /spec/rules/0/host
        value: docs.agriaudit.example.com
  # Producción: más margen de escalado y recursos.
  - target: { kind: Deployment, name: backend }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1536Mi"
  - target: { kind: HorizontalPodAutoscaler, name: backend }
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target: { kind: Deployment, name: ocr }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
