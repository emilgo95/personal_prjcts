spring:
  application:
    name: agriaudit-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agriaudit}
    username: ${SPRING_DATASOURCE_USERNAME:agriaudit}
    password: ${SPRING_DATASOURCE_PASSWORD:agriaudit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP_WITH_TIMEZONE
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  thymeleaf:
    check-template-location: false
    cache: true

server:
  port: 8081
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

agriaudit:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-to-a-long-random-string-value}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  storage:
    dir: ${STORAGE_DIR:./data/storage}
  admin:
    email: ${ADMIN_EMAIL:admin@demo.test}
    password: ${ADMIN_PASSWORD:Admin123!}
    org-name: ${ADMIN_ORG_NAME:Organización Demo}
  demo:
    seed: ${AGRIAUDIT_DEMO_SEED:true}
  ocr:
    url: ${AGRIAUDIT_OCR_URL:}
    timeout-seconds: ${AGRIAUDIT_OCR_TIMEOUT:120}
    min-confidence-warn: 0.55
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

logging:
  level:
    root: INFO
    com.agriaudit: DEBUG
